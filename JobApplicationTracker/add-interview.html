<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <meta name="description"
          content="Add an interview connected to a saved job application." />

    <title>Add Interview - In Formation Jobs</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="site.js"></script>
    <link rel="stylesheet" href="site.css" />

    <script>
        var applications = [
            {
                ApplicationId: 1,
                CompanyName: "Whatnot",
                JobTitle: "Trust & Safety Agent"
            },
            {
                ApplicationId: 2,
                CompanyName: "Honeywell",
                JobTitle: "Program Control Specialist"
            },
            {
                ApplicationId: 3,
                CompanyName: "Arizona Auditor General",
                JobTitle: "IT Audit Intern"
            }
        ];

        var recruiters = [
            {
                RecruiterId: 1,
                ApplicationId: 1,
                FirstName: "Eric",
                LastName: "Swartz"
            },
            {
                RecruiterId: 2,
                ApplicationId: 2,
                FirstName: "Sarah",
                LastName: "Chen"
            },
            {
                RecruiterId: 3,
                ApplicationId: 3,
                FirstName: "Emily",
                LastName: "Ross"
            }
        ];


        $(document).ready(function () {

            LoadAccountInformation();
            LoadApplicationOptions();

            $("#applicationId").on("change", UpdateRecruiterOptions);

            $("#recruiterId").on("change", FillInterviewerName);

            $("#interviewForm").on("submit", function (event) {
                event.preventDefault();
                SaveInterview();
            });

            $("#clearInterviewForm").on("click", ClearInterviewForm);
        });


        /*
            Adds the user's saved applications to the
            Linked Application dropdown.
        */

        function LoadApplicationOptions() {

            applications.forEach(function (application) {

                $("#applicationId").append(
                    $("<option>")
                        .val(application.ApplicationId)
                        .text(application.CompanyName + " — " + application.JobTitle)
                );
            });
        }


        /*
            Shows only recruiters connected to the selected
            application.
        */

        function UpdateRecruiterOptions() {

            var applicationId = parseInt($("#applicationId").val(), 10);
            var recruiterSelect = $("#recruiterId");

            recruiterSelect.empty();

            recruiterSelect.append(
                $("<option>")
                    .val("")
                    .text("No linked recruiter")
            );

            if (!applicationId) {
                recruiterSelect.prop("disabled", true);
                return;
            }

            var matchingRecruiters = recruiters.filter(function (recruiter) {
                return recruiter.ApplicationId == applicationId;
            });

            matchingRecruiters.forEach(function (recruiter) {

                var recruiterName =
                    (recruiter.FirstName + " " + recruiter.LastName).trim();

                recruiterSelect.append(
                    $("<option>")
                        .val(recruiter.RecruiterId)
                        .text(recruiterName)
                );
            });

            recruiterSelect.prop("disabled", false);
        }


        /*
            Copies the selected saved recruiter's name into
            the interviewer field.
        */

        function FillInterviewerName() {

            var recruiterId = parseInt($("#recruiterId").val(), 10);

            if (!recruiterId) {
                return;
            }

            var recruiter = recruiters.find(function (recruiterItem) {
                return recruiterItem.RecruiterId == recruiterId;
            });

            if (!recruiter) {
                return;
            }

            $("#interviewerName").val(
                (recruiter.FirstName + " " + recruiter.LastName).trim()
            );
        }


        /*
            Placeholder save behavior.

            Your team can later replace this with an AJAX call
            to ProjectServices.asmx/AddInterview.
        */

        function SaveInterview() {

            var form = document.getElementById("interviewForm");

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            ClearPageMessage();

            var interviewDateTime =
                $("#interviewDate").val() +
                " " +
                $("#interviewTime").val() +
                ":00";

            var interview = {
                ApplicationId: parseInt($("#applicationId").val(), 10),
                RecruiterId: $("#recruiterId").val()
                    ? parseInt($("#recruiterId").val(), 10)
                    : null,
                InterviewTitle: $("#interviewTitle").val().trim(),
                InterviewType: $("#interviewType").val(),
                InterviewDate: interviewDateTime,
                InterviewerName: $("#interviewerName").val().trim(),
                LocationOrLink: $("#locationOrLink").val().trim(),
                Notes: $("#interviewNotes").val().trim(),
                InterviewStatus: "Scheduled"
            };

            console.log(interview);

            ShowPageMessage(
                "Interview information is ready to be connected to the backend.",
                "success"
            );
        }


        /*
            Restores every field to its default value.
        */

        function ClearInterviewForm() {

            document.getElementById("interviewForm").reset();

            $("#recruiterId")
                .empty()
                .append(
                    $("<option>")
                        .val("")
                        .text("Select an application first")
                )
                .prop("disabled", true);

            ClearPageMessage();
            $("#applicationId").focus();
        }
    </script>

    <style>
        /*
            Add Interview page heading.

            Page width and breadcrumbs come from site.css.
        */

        .pageHeading {
            margin-bottom: 22px;
        }

            .pageHeading h2 {
                margin: 0 0 8px;
                color: #0f172a;
                font-size: 36px;
            }

            .pageHeading p {
                margin: 0;
                color: #64748b;
                font-size: 16px;
            }


        /*
            Main interview form card.
        */

        .interviewCard {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background-color: white;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.10);
        }


        /*
            Interview form grid.

            Labels, inputs, selects, and textareas use the
            shared form styles from site.css.
        */

        .interviewFormGrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 24px;
            row-gap: 2px;
        }

            .interviewFormGrid .formField {
                margin-bottom: 18px;
            }

        .fullWidthField {
            grid-column: 1 / -1;
        }

        #interviewNotes {
            min-height: 90px;
        }


        /*
            Form footer buttons.
        */

        .formActions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 6px -28px -28px;
            padding: 18px 28px;
            border-top: 1px solid #e2e8f0;
        }

        .backToRemindersButton {
            text-decoration: none;
        }

        .rightFormActions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

            .rightFormActions .secondaryButton {
                min-width: 110px;
            }

            .rightFormActions .primaryButton {
                min-width: 150px;
            }


        /*
            Add Interview responsive layout.
        */

        @media (max-width: 650px) {

            .interviewFormGrid {
                grid-template-columns: 1fr;
            }

            .fullWidthField {
                grid-column: auto;
            }

            .formActions {
                align-items: stretch;
                flex-direction: column;
            }

            .backToRemindersButton {
                width: 100%;
                text-align: center;
            }

            .rightFormActions {
                width: 100%;
            }

                .rightFormActions button {
                    flex: 1;
                }
        }
    </style>
</head>

<body>

    <header>

        <div>
            <h1>In Formation Jobs</h1>

            <p>
                Keep your job search organized and moving forward.
            </p>
        </div>

        <div class="accountArea">

            <p id="welcomeMessage">
                Loading account...
            </p>

            <div id="signedInArea">

                <a class="accountLink"
                   href="#"
                   onclick="LogOut(); return false;">
                    Log Out
                </a>

            </div>

        </div>

    </header>

    <div class="pageWrapper">

        <nav class="pageNav">

            <a href="home-page.html">
                Home
            </a>

            <span>&gt;</span>

            <a href="reminder-interviews.html">
                Reminders &amp; Interviews
            </a>

            <span>&gt;</span>

            <span>
                Add Interview
            </span>

        </nav>

        <div class="pageHeading">

            <h2>
                Add Interview
            </h2>

            <p>
                Schedule an interview and connect it to one of
                your saved job applications.
            </p>

        </div>

        <main class="interviewCard">

            <form id="interviewForm">

                <div class="interviewFormGrid">

                    <div class="formField">

                        <label for="applicationId">
                            Linked Application
                            <span class="requiredMark">*</span>
                        </label>

                        <select id="applicationId"
                                required>

                            <option value=""
                                    selected
                                    disabled>
                                Select an application
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="recruiterId">
                            Linked Recruiter
                        </label>

                        <select id="recruiterId"
                                disabled>

                            <option value="">
                                Select an application first
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="interviewTitle">
                            Interview Title
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="text"
                               id="interviewTitle"
                               maxlength="100"
                               placeholder="Example: Phone Screen"
                               required />

                    </div>

                    <div class="formField">

                        <label for="interviewType">
                            Interview Type
                            <span class="requiredMark">*</span>
                        </label>

                        <select id="interviewType"
                                required>

                            <option value=""
                                    selected
                                    disabled>
                                Select interview type
                            </option>

                            <option value="Phone">
                                Phone
                            </option>

                            <option value="Video">
                                Video
                            </option>

                            <option value="Onsite">
                                Onsite
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="interviewDate">
                            Interview Date
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="date"
                               id="interviewDate"
                               required />

                    </div>

                    <div class="formField">

                        <label for="interviewTime">
                            Interview Time
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="time"
                               id="interviewTime"
                               required />

                    </div>

                    <div class="formField">

                        <label for="interviewerName">
                            Interviewer Name
                        </label>

                        <input type="text"
                               id="interviewerName"
                               maxlength="100"
                               placeholder="Enter interviewer name" />

                    </div>

                    <div class="formField">

                        <label for="locationOrLink">
                            Location or Meeting Link
                        </label>

                        <input type="text"
                               id="locationOrLink"
                               maxlength="500"
                               placeholder="Enter address, phone number, or meeting link" />

                    </div>

                    <div class="formField fullWidthField">

                        <label for="interviewNotes">
                            Notes
                        </label>

                        <textarea id="interviewNotes"
                                  maxlength="2000"
                                  placeholder="Enter preparation notes or interview details..."></textarea>

                    </div>

                </div>

                <p id="pageMessage"></p>

                <div class="formActions">

                    <a class="secondaryButton backToRemindersButton"
                       href="reminder-interviews.html">
                        Back to Reminders
                    </a>

                    <div class="rightFormActions">

                        <button type="button"
                                id="clearInterviewForm"
                                class="secondaryButton">
                            Clear
                        </button>

                        <button type="submit"
                                id="saveInterviewButton"
                                class="primaryButton">
                            Save Interview
                        </button>

                    </div>

                </div>

            </form>

        </main>

    </div>

</body>
</html>
