<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <meta name="description"
          content="Edit a recruiter contact." />

    <title>Edit Recruiter - In Formation Jobs</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="site.js"></script>

    <link rel="stylesheet"
          href="site.css" />

    <script>
            var recruiterId = 0;
            var currentRecruiter = null;


            $(document).ready(function () {
                LoadAccountInformation();
                UpdatePageNavigation();

                var parameters = new URLSearchParams(window.location.search);
                recruiterId = parseInt(parameters.get("recruiterId"), 10);

                if (!recruiterId) {
                    ShowPageMessage("A valid recruiter is required.", "error");
                    $("#saveRecruiterButton").prop("disabled", true);
                    return;
                }

                $("#recruiterForm").submit(function (event) {
                    event.preventDefault();
                    SaveRecruiter();
                });

                $("#resetRecruiterForm").on("click", ResetRecruiterForm);

                LoadRecruiter();
            });


            /*
                Loads the recruiter being edited.
            */

            function LoadRecruiter() {
                $.ajax({
                    type: "POST",
                    url: "ProjectServices.asmx/GetRecruiter",
                    data: JSON.stringify({
                        recruiterId: recruiterId
                    }),
                    contentType: "application/json; charset=utf-8",
                    dataType: "json",

                    success: function (msg) {
                        if (!msg.d) {
                            ShowPageMessage("The recruiter could not be found.", "error");
                            $("#saveRecruiterButton").prop("disabled", true);
                            return;
                        }

                        currentRecruiter = msg.d;
                        PopulateRecruiterForm();
                    },

                    error: function (xhr) {
                        console.log(xhr.responseText);
                        ShowPageMessage("Unable to load the recruiter.", "error");
                        $("#saveRecruiterButton").prop("disabled", true);
                    }
                });
            }


            /*
                Populates the form with the saved recruiter information.
            */

            function PopulateRecruiterForm() {
                if (!currentRecruiter) {
                    return;
                }

                $("#firstName").val(currentRecruiter.FirstName);
                $("#lastName").val(currentRecruiter.LastName);
                $("#email").val(currentRecruiter.Email);
                $("#phone").val(currentRecruiter.Phone);
                $("#lastContactDate").val(currentRecruiter.LastContactDate);
                $("#followUpReminderDate").val(currentRecruiter.FollowUpReminderDate);
                $("#notes").val(currentRecruiter.Notes);

                $("#applicationId")
                    .empty()
                    .append(
                        $("<option>")
                            .val(currentRecruiter.ApplicationId)
                            .text(currentRecruiter.CompanyName + " — " + currentRecruiter.JobTitle)
                    );
            }


            /*
                Updates the recruiter with the entered information.
            */

            function SaveRecruiter() {
                var form = document.getElementById("recruiterForm");

                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                ClearPageMessage();
                $("#saveRecruiterButton").prop("disabled", true);

                var parameters = JSON.stringify({
                    recruiterId: recruiterId,
                    firstName: $("#firstName").val().trim(),
                    lastName: $("#lastName").val().trim(),
                    email: $("#email").val().trim(),
                    phone: $("#phone").val().trim(),
                    followUpReminderDate: $("#followUpReminderDate").val(),
                    lastContactDate: $("#lastContactDate").val(),
                    notes: $("#notes").val().trim()
                });

                $.ajax({
                    type: "POST",
                    url: "ProjectServices.asmx/UpdateRecruiter",
                    data: parameters,
                    contentType: "application/json; charset=utf-8",
                    dataType: "json",

                    success: function (msg) {
                        if (msg.d == "Success") {
                            ShowPageMessage("Recruiter updated successfully.", "success");
                            LoadRecruiter();
                        }
                        else {
                            ShowPageMessage(msg.d, "error");
                        }
                    },

                    error: function (xhr) {
                        console.log(xhr.responseText);
                        ShowPageMessage("Unable to update the recruiter. Check the browser console.", "error");
                    },

                    complete: function () {
                        $("#saveRecruiterButton").prop("disabled", false);
                    }
                });
            }


            /*
                Restores the recruiter's saved information.
            */

            function ResetRecruiterForm() {
                ClearPageMessage();
                PopulateRecruiterForm();
            }
        </script>

    <style>

        /* Add Recruiter page heading. Page width and breadcrumb styling come from site.css.*/

        .pageHeading {
            margin-bottom: 22px;
        }

            .pageHeading h2 {
                margin: 0 0 8px;
                color: #0f172a;
                font-size: 36px;
            }

            .pageHeading p {
                margin: 0;
                color: #64748b;
                font-size: 16px;
            }


        /* Main recruiter form card.*/

        .recruiterFormCard {
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background-color: white;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.10);
        }


        /* Form grid.
            The shared .formField styles in site.css handle
            labels, inputs, selects, textareas, and focus states.
        */

        .recruiterFormGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 26px;
            row-gap: 4px;
        }

            .recruiterFormGrid .formField {
                margin-bottom: 18px;
            }

        .fullWidthField {
            grid-column: 1 / -1;
        }

        .twoColumnField {
            grid-column: span 1;
        }

        #notes {
            min-height: 86px;
        }


        /* Form footer buttons.*/

        .formActions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 4px -28px -28px;
            padding: 18px 28px;
            border-top: 1px solid #e2e8f0;
            background-color: #ffffff;
        }

        .backToRecruitersButton {
            text-decoration: none;
        }

        .rightFormActions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

            .rightFormActions .secondaryButton,
            .rightFormActions .primaryButton {
                min-width: 120px;
            }


        /* Small information note below the form.*/

        .recruiterFormNotice {
            margin: 20px 0 0;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>

        <div>

            <h1>
                In Formation Jobs
            </h1>

            <p>
                Keep your job search organized and moving forward.
            </p>

        </div>

        <div class="accountArea">

            <p id="welcomeMessage">
                Loading account...
            </p>

            <div id="signedInArea">

                <a class="accountLink"
                   href="#"
                   onclick="LogOut(); return false;">
                    Log Out
                </a>

            </div>

        </div>

    </header>

    <div class="pageWrapper">

            <nav class="pageNav">

            <a href="home-page.html">
                Home
            </a>

            <span>&gt;</span>

            <a id="sourceBreadcrumb"
            href="view-recruiters.html">
                View Recruiters
            </a>

            <span>&gt;</span>

            <span>
                Edit Recruiter
            </span>

        </nav>

        <div class="pageHeading">

            <h2>
                Edit Recruiter
            </h2>

            <p>
                Edit a recruiter contact.
            </p>

        </div>

        <main class="recruiterFormCard">

            <form id="recruiterForm">

                <div class="recruiterFormGrid">

                    <div class="formField">

                        <label for="firstName">
                            First Name
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="text"
                               id="firstName"
                               maxlength="50"
                               placeholder="Enter first name"
                               required />

                    </div>

                    <div class="formField">

                        <label for="lastName">
                            Last Name
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="text"
                               id="lastName"
                               maxlength="50"
                               placeholder="Enter last name"
                               required />

                    </div>

                    <div class="formField fullWidthField">

                        <label for="applicationId">
                            Linked Application
                            <span class="requiredMark">*</span>
                        </label>

                        <select id="applicationId"
                                disabled>

                            <option value="">
                                Loading linked application...
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="email">
                            Email
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="email"
                               id="email"
                               maxlength="100"
                               placeholder="Enter email address"
                               required />

                    </div>

                    <div class="formField">

                        <label for="phone">
                            Phone
                        </label>

                        <input type="tel"
                               id="phone"
                               maxlength="25"
                               placeholder="Enter phone number" />

                    </div>

                    <div class="formField">

                        <label for="lastContactDate">
                            Last Contact
                        </label>

                        <input type="date"
                               id="lastContactDate" />

                    </div>

                    <div class="formField">

                        <label for="followUpReminderDate">
                            Follow-Up Reminder
                        </label>

                        <input type="date"
                               id="followUpReminderDate" />

                    </div>

                    <div class="formField fullWidthField">

                        <label for="notes">
                            Notes
                        </label>

                        <textarea id="notes"
                                  maxlength="1000"
                                  placeholder="Enter any notes about this recruiter..."></textarea>

                    </div>

                </div>

                <p id="pageMessage"></p>

                <div class="formActions">

                    <button type="button"
                            class="secondaryButton backToRecruitersButton"
                            onclick="GoBackOrDefault('view-recruiters.html');">
                        Back
                    </button>

                    <div class="rightFormActions">

                        <button type="button"
                                id="resetRecruiterForm"
                                class="secondaryButton">
                            Reset Changes
                        </button>

                        <button type="submit"
                                id="saveRecruiterButton"
                                class="primaryButton">
                            Save Changes
                        </button>

                    </div>

                </div>

            </form>

        </main>

        <p class="recruiterFormNotice">
            Keeping recruiter contacts organized helps you stay
            on top of your applications and follow-ups.
        </p>

    </div>

</body>
</html>
