<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <meta name="description"
          content="View and manage user accounts." />

    <title>User Accounts - In Formation Jobs</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="site.js"></script>
    <link rel="stylesheet" href="site.css" />

    <script type="text/javascript">

        $(document).ready(function () {

            LoadAccountInformation();
            CheckAdminAccess();
        });

        function LoadUsers(successMessage) {

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/GetUsers",
                data: "{}",
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {

                    var users = msg.d || [];
                    var tableBody = $("#usersTableBody");

                    tableBody.empty();
                    $("#emptyUsersMessage").hide();

                    UpdateUserSummary(users);

                    if (successMessage) {
                        ShowPageMessage(successMessage, "success");
                    }

                    if (users.length == 0) {
                        $("#emptyUsersMessage").show();
                        return;
                    }

                    users.forEach(function (user) {

                        var row = $("<tr></tr>");

                        row.append(
                            $("<td></td>")
                                .addClass("userName")
                                .text(
                                    ((user.FirstName || "") + " " +
                                    (user.LastName || "")).trim()
                                )
                        );

                        row.append(
                            $("<td></td>").text(user.Email || "")
                        );

                        row.append(
                            $("<td></td>").text(user.Username || "")
                        );

                        var role =
                            (user.Role || "").toLowerCase();

                        var roleBadge =
                            $("<span></span>")
                                .addClass("roleBadge")
                                .text(
                                    role == "admin"
                                        ? "Administrator"
                                        : "User"
                                );

                        if (role == "admin") {
                            roleBadge.addClass("adminBadge");
                        }
                        else {
                            roleBadge.addClass("userBadge");
                        }

                        row.append(
                            $("<td></td>").append(roleBadge)
                        );

                        var actionCell = $("<td></td>");

                        var actions = $("<div></div>").addClass("userActions");

                        if (role == "user") {

                            var promoteButton =
                                $("<button type='button'>Promote</button>")
                                    .addClass("promoteButton");

                            promoteButton.click(function () {
                                PromoteUser(user.UserId);
                            });

                            actions.append(promoteButton);
                        }

                        var deleteButton =
                            $("<button type='button'>Delete</button>")
                                .addClass("deleteUserButton");

                        deleteButton.click(function () {
                            DeleteUser(user.UserId);
                        });

                        actions.append(deleteButton);

                        actionCell.append(actions);

                        row.append(actionCell);
                        tableBody.append(row);
                        });
                },

                error: function (xhr) {
                    console.log(xhr.responseText);
                    ShowPageMessage("Unable to load user accounts.", "error");
                }
            });
        }

        function UpdateUserSummary(users) {

            var administratorCount = 0;
            var standardUserCount = 0;

            users.forEach(function (user) {

                if ((user.Role || "").toLowerCase() == "admin") {
                    administratorCount++;
                }
                else {
                    standardUserCount++;
                }
            });

            $("#totalUserCount").text(users.length);
            $("#administratorCount").text(administratorCount);
            $("#standardUserCount").text(standardUserCount);
        }

        function PromoteUser(userId) {

            if (!confirm("Promote this user to administrator?")) {
                return;
            }

            var parameters = JSON.stringify({
                userId: userId
            });

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/PromoteUser",
                data: parameters,
                contentType:
                    "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {

                    if (msg.d == "User promoted successfully.") {
                        LoadUsers(msg.d);
                    }
                    else {
                        ShowPageMessage(msg.d, "error");
                    }
                },

                error: function (xhr) {

                    console.log(xhr.responseText);

                    ShowPageMessage("Unable to promote the user.", "error");
                }
            });
        }
        function DeleteUser(userId) {

            if (!confirm("Delete this user account? This cannot be undone.")) {
                return;
            }

            var parameters = JSON.stringify({
                userId: userId
            });

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/DeleteUser",
                data: parameters,
                contentType:
                    "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {

                    if (msg.d == "User account deleted successfully.") {
                        LoadUsers(msg.d);
                    }
                    else {
                        ShowPageMessage(msg.d, "error");
                    }
                },

                error: function (xhr) {

                    console.log(xhr.responseText);

                    ShowPageMessage("Unable to delete the user.", "error");
                }
            });
        }
        function CheckAdminAccess() {

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/GetCurrentUserRole",
                data: "{}",
                contentType:
                    "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {

                    var userInfo = msg.d;

                    if (userInfo == "Not Logged In") {

                        ShowPageMessage("You must be logged in.", "error");

                        $("#usersSection").hide();
                        return;
                    }

                    var userParts =
                        userInfo.split("|");

                    if (userParts.length < 2 ||
                        userParts[1].trim().toLowerCase() != "admin") {

                        ShowPageMessage(
                            "Only administrators can view user accounts.", "error");

                        $("#usersSection").hide();
                        return;
                    }

                    $("#usersSection").show();
                    LoadUsers();

                },

                error: function () {

                    ShowPageMessage(
                        "Unable to verify administrator access.", "error");

                    $("#usersSection").hide();
                }
            });
        }
    </script>

    <style>

        .usersCard {
            padding: 32px 38px;
        }

        .summaryCards {
            display: flex;
            gap: 18px;
            margin-bottom: 24px;
        }

        .summaryCard {
            min-width: 190px;
            padding: 18px 22px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .summaryLabel {
            display: block;
            margin-bottom: 6px;
            color: #64748b;
            font-size: 14px;
            font-weight: bold;
        }

        .summaryNumber {
            display: block;
            font-size: 30px;
            font-weight: bold;
        }

        .totalUserNumber {
            color: #1f3c88;
        }

        .administratorNumber {
            color: #7c3aed;
        }

        .standardUserNumber {
            color: #15803d;
        }
        .userName {
            color: #0f172a;
            font-weight: bold;
        }

        .roleBadge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .adminBadge {
            background-color: #ede9fe;
            color: #7c3aed;
        }

        .userBadge {
            background-color: #dcfce7;
            color: #15803d;
        }

        .userActions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .promoteButton,
        .deleteUserButton {
            padding: 8px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .promoteButton {
            border: 1px solid #1f3c88;
            background-color: #1f3c88;
            color: white;
        }

        .promoteButton:hover {
            background-color: #162f70;
        }

        .deleteUserButton {
            border: 1px solid #dc2626;
            background-color: white;
            color: #dc2626;
        }

        .deleteUserButton:hover {
            background-color: #dc2626;
            color: white;
        }

        #emptyUsersMessage {
            display: none;
            padding: 24px;
            color: #64748b;
            background-color: #f8fafc;
            border-radius: 7px;
            text-align: center;
        }

    </style>
</head>

<body>

    <header>

        <div>

            <h1>In Formation Jobs</h1>

            <p>
                Keep your job search organized and moving forward.
            </p>

        </div>

        <div class="accountArea">

            <p id="welcomeMessage">
                Loading account...
            </p>

            <div id="signedInArea">

                <a class="accountLink"
                   href="#"
                   onclick="LogOut(); return false;">
                    Log Out
                </a>

            </div>

        </div>

    </header>

    <div class="pageWrapper">

        <nav class="pageNav">

            <a href="home-page.html">
                Home
            </a>

            <span>&gt;</span>

            <span>User Accounts</span>

        </nav>

        <main class="contentCard usersCard">

            <div class="pageHeading adminPageHeading">

                <h2>User Accounts</h2>

                <p>
                    View and manage registered user accounts.
                </p>

            </div>

            <div class="toggleButtons">

                <button type="button"
                        class="toggleButton"
                        onclick="window.location.href='account-requests.html';">
                    Account Requests
                </button>

                <button type="button"
                        class="toggleButton activeToggle">
                    User Accounts
                </button>

            </div>

            <div class="summaryCards">

                <div class="summaryCard">
                    <span class="summaryLabel">Total Users</span>
                    <span id="totalUserCount"
                        class="summaryNumber totalUserNumber">0</span>
                </div>

                <div class="summaryCard">
                    <span class="summaryLabel">Administrators</span>
                    <span id="administratorCount"
                        class="summaryNumber administratorNumber">0</span>
                </div>

                <div class="summaryCard">
                    <span class="summaryLabel">Standard Users</span>
                    <span id="standardUserCount"
                        class="summaryNumber standardUserNumber">0</span>
                </div>

            </div>

            <p id="pageMessage"></p>

            <section id="usersSection">

                <div class="tableWrapper">

                    <table class="dataTable">

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="usersTableBody"></tbody>

                    </table>

                </div>

                 <p id="emptyUsersMessage"> No user accounts were found.</p>

            </section>

        </main>

    </div>

</body>
</html>
