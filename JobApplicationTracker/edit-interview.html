<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <meta name="description"
          content="Edit an interview connected to a saved job application." />

    <title>Edit Interview - In Formation Jobs</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="site.js"></script>
    <link rel="stylesheet" href="site.css" />

    <script>
        var applications = [];
        var recruiters = [];
        var currentInterview = null;
        var interviewId = 0;


        $(document).ready(function () {
            LoadAccountInformation();

            var parameters = new URLSearchParams(window.location.search);
            interviewId = parseInt(parameters.get("interviewId"), 10);

            if (!interviewId) {
                ShowPageMessage("A valid interview is required.", "error");
                $("#saveInterviewButton").prop("disabled", true);
                return;
            }

            $("#applicationId").on("change", UpdateRecruiterOptions);
            $("#recruiterId").on("change", FillInterviewerName);

            $("#interviewForm").on("submit", function (event) {
                event.preventDefault();
                SaveInterview();
            });

            $("#clearInterviewForm").on("click", ResetInterviewForm);

            LoadApplicationOptions();
            LoadRecruiters();
            LoadInterview()
        });


        /*
            Adds the user's saved applications to the
            Linked Application dropdown.
        */

        function LoadApplicationOptions() {
            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/GetApplications",
                data: "{}",
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {
                    applications = msg.d || [];

                    var applicationSelect = $("#applicationId");
                    applicationSelect.find("option:not(:first)").remove();

                    applications.forEach(function (application) {
                        applicationSelect.append(
                            $("<option>")
                                .val(application.ApplicationId)
                                .text(application.CompanyName + " — " + application.JobTitle)
                        );
                    });

                    if (applications.length == 0) {
                        ShowPageMessage("You need to add an application before scheduling an interview.", "error");
                        $("#saveInterviewButton").prop("disabled", true);
                    }

                    PopulateInterviewForm();
                },

                error: function (xhr) {
                    console.log(xhr.responseText);
                    ShowPageMessage("Unable to load your applications.", "error");
                }
            });
        }

        function LoadRecruiters() {
            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/GetRecruiters",
                data: "{}",
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {
                    recruiters = msg.d || [];

                    if ($("#applicationId").val()) {
                        UpdateRecruiterOptions();
                    }

                    PopulateInterviewForm();
                },

                error: function (xhr) {
                    console.log(xhr.responseText);
                    recruiters = [];
                    ShowPageMessage("Unable to load your recruiters.", "error");
                }
            });
        }

        /*
            Loads the interview being edited.
        */

        function LoadInterview() {
            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/GetInterview",
                data: JSON.stringify({
                    interviewId: interviewId
                }),
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {
                    if (!msg.d) {
                        ShowPageMessage("The interview could not be found.", "error");
                        $("#saveInterviewButton").prop("disabled", true);
                        return;
                    }

                    currentInterview = msg.d;
                    PopulateInterviewForm();
                },

                error: function (xhr) {
                    console.log(xhr.responseText);
                    ShowPageMessage("Unable to load the interview.", "error");
                    $("#saveInterviewButton").prop("disabled", true);
                }
            });
        }

        /*
            Populates the form with the saved interview values.
        */

        function PopulateInterviewForm() {
            if (!currentInterview ||
                applications.length == 0 ||
                recruiters == null) {
                return;
            }

            $("#applicationId").val(currentInterview.ApplicationId);

            UpdateRecruiterOptions();

            $("#recruiterId").val(
                currentInterview.RecruiterId
                    ? currentInterview.RecruiterId
                    : ""
            );

            $("#interviewTitle").val(currentInterview.InterviewTitle);
            $("#interviewType").val(currentInterview.InterviewType);

            var dateTimeParts = currentInterview.InterviewDate.split(" ");

            $("#interviewDate").val(dateTimeParts[0]);

            if (dateTimeParts.length > 1) {
                $("#interviewTime").val(dateTimeParts[1].substring(0, 5));
            }

            $("#interviewerName").val(currentInterview.InterviewerName);
            $("#locationOrLink").val(currentInterview.LocationOrLink);
            $("#interviewNotes").val(currentInterview.Notes);
            $("#interviewStatus").val(currentInterview.InterviewStatus);
        }

        /*
            Shows only recruiters connected to the selected
            application.
        */

        function UpdateRecruiterOptions() {

            var applicationId = parseInt($("#applicationId").val(), 10);
            var recruiterSelect = $("#recruiterId");

            recruiterSelect.empty();

            recruiterSelect.append(
                $("<option>")
                    .val("")
                    .text("No linked recruiter")
            );

            if (!applicationId) {
                recruiterSelect.prop("disabled", true);
                return;
            }

            var matchingRecruiters = recruiters.filter(function (recruiter) {
                return recruiter.ApplicationId == applicationId;
            });

            matchingRecruiters.forEach(function (recruiter) {

                var recruiterName =
                    (recruiter.FirstName + " " + recruiter.LastName).trim();

                recruiterSelect.append(
                    $("<option>")
                        .val(recruiter.RecruiterId)
                        .text(recruiterName)
                );
            });

            recruiterSelect.prop("disabled", false);
        }


        /*
            Copies the selected saved recruiter's name into
            the interviewer field.
        */

        function FillInterviewerName() {

            var recruiterId = parseInt($("#recruiterId").val(), 10);

            if (!recruiterId) {
                return;
            }

            var recruiter = recruiters.find(function (recruiterItem) {
                return recruiterItem.RecruiterId == recruiterId;
            });

            if (!recruiter) {
                return;
            }

            $("#interviewerName").val(
                (recruiter.FirstName + " " + recruiter.LastName).trim()
            );
        }

        /*
            Updates the interview with the entered information.
        */

        function SaveInterview() {
            var form = document.getElementById("interviewForm");

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            ClearPageMessage();
            $("#saveInterviewButton").prop("disabled", true);

            var interviewDateTime = $("#interviewDate").val() + " " + $("#interviewTime").val() + ":00";

            var parameters = JSON.stringify({
                interviewId: interviewId,
                applicationId: parseInt($("#applicationId").val(), 10),
                recruiterId: $("#recruiterId").val() ? parseInt($("#recruiterId").val(), 10) : null,
                interviewTitle: $("#interviewTitle").val().trim(),
                interviewType: $("#interviewType").val(),
                interviewDate: interviewDateTime,
                interviewerName: $("#interviewerName").val().trim(),
                locationOrLink: $("#locationOrLink").val().trim(),
                notes: $("#interviewNotes").val().trim(),
                interviewStatus: $("#interviewStatus").val()
            });

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/UpdateInterview",
                data: parameters,
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {
                    if (msg.d == "Success") {
                        ShowPageMessage("Interview updated successfully.", "success");
                        LoadInterview();
                    }
                    else {
                        ShowPageMessage(msg.d, "error");
                    }
                },

                error: function (xhr) {
                    console.log(xhr.responseText);
                    ShowPageMessage("Unable to update the interview. Check the browser console.", "error");
                },

                complete: function () {
                    $("#saveInterviewButton").prop("disabled", false);
                }
            });
        }


        /*
            Restores every field to its default value.
        */

        function ResetInterviewForm() {
            ClearPageMessage();
            PopulateInterviewForm();
        }
    </script>

    <style>
        /*
            Add Interview page heading.

            Page width and breadcrumbs come from site.css.
        */

        .pageHeading {
            margin-bottom: 22px;
        }

            .pageHeading h2 {
                margin: 0 0 8px;
                color: #0f172a;
                font-size: 36px;
            }

            .pageHeading p {
                margin: 0;
                color: #64748b;
                font-size: 16px;
            }


        /*
            Main interview form card.
        */

        .interviewCard {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background-color: white;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.10);
        }


        /*
            Interview form grid.

            Labels, inputs, selects, and textareas use the
            shared form styles from site.css.
        */

        .interviewFormGrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 24px;
            row-gap: 2px;
        }

            .interviewFormGrid .formField {
                margin-bottom: 18px;
            }

        .fullWidthField {
            grid-column: 1 / -1;
        }

        #interviewNotes {
            min-height: 90px;
        }


        /*
            Form footer buttons.
        */

        .formActions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 6px -28px -28px;
            padding: 18px 28px;
            border-top: 1px solid #e2e8f0;
        }

        .backToRemindersButton {
            text-decoration: none;
        }

        .rightFormActions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

            .rightFormActions .secondaryButton {
                min-width: 110px;
            }

            .rightFormActions .primaryButton {
                min-width: 150px;
            }


        /*
            Add Interview responsive layout.
        */

        @media (max-width: 650px) {

            .interviewFormGrid {
                grid-template-columns: 1fr;
            }

            .fullWidthField {
                grid-column: auto;
            }

            .formActions {
                align-items: stretch;
                flex-direction: column;
            }

            .backToRemindersButton {
                width: 100%;
                text-align: center;
            }

            .rightFormActions {
                width: 100%;
            }

                .rightFormActions button {
                    flex: 1;
                }
        }
    </style>
</head>

<body>

    <header>

        <div>
            <h1>In Formation Jobs</h1>

            <p>
                Keep your job search organized and moving forward.
            </p>
        </div>

        <div class="accountArea">

            <p id="welcomeMessage">
                Loading account...
            </p>

            <div id="signedInArea">

                <a class="accountLink"
                   href="#"
                   onclick="LogOut(); return false;">
                    Log Out
                </a>

            </div>

        </div>

    </header>

    <div class="pageWrapper">

        <nav class="pageNav">

            <a href="home-page.html">
                Home
            </a>

            <span>&gt;</span>

            <a href="reminder-interviews.html">
                Reminders &amp; Interviews
            </a>

            <span>&gt;</span>

            <span>
                Edit Interview
            </span>

        </nav>

        <div class="pageHeading">

            <h2>
                Edit Interview
            </h2>

            <p>
                Schedule an interview and connect it to one of
                your saved job applications.
            </p>

        </div>

        <main class="interviewCard">

            <form id="interviewForm">

                <div class="interviewFormGrid">

                    <div class="formField">

                        <label for="applicationId">
                            Linked Application
                            <span class="requiredMark">*</span>
                        </label>

                        <select id="applicationId"
                                required>

                            <option value=""
                                    selected
                                    disabled>
                                Select an application
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="recruiterId">
                            Linked Recruiter
                        </label>

                        <select id="recruiterId"
                                disabled>

                            <option value="">
                                Select an application first
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="interviewTitle">
                            Interview Title
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="text"
                               id="interviewTitle"
                               maxlength="100"
                               placeholder="Example: Phone Screen"
                               required />

                    </div>

                    <div class="formField">

                        <label for="interviewType">
                            Interview Type
                            <span class="requiredMark">*</span>
                        </label>

                        <select id="interviewType"
                                required>

                            <option value=""
                                    selected
                                    disabled>
                                Select interview type
                            </option>

                            <option value="Phone">
                                Phone
                            </option>

                            <option value="Video">
                                Video
                            </option>

                            <option value="Onsite">
                                Onsite
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="formField">

                        <label for="interviewDate">
                            Interview Date
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="date"
                               id="interviewDate"
                               required />

                    </div>

                    <div class="formField">

                        <label for="interviewTime">
                            Interview Time
                            <span class="requiredMark">*</span>
                        </label>

                        <input type="time"
                               id="interviewTime"
                               required />

                    </div>

                    <div class="formField">

                        <label for="interviewerName">
                            Interviewer Name
                        </label>

                        <input type="text"
                               id="interviewerName"
                               maxlength="100"
                               placeholder="Enter interviewer name" />

                    </div>

                    <div class="formField">

                        <label for="locationOrLink">
                            Location or Meeting Link
                        </label>

                        <input type="text"
                               id="locationOrLink"
                               maxlength="500"
                               placeholder="Enter address, phone number, or meeting link" />

                    </div>

                    <div class="formField">
                        <label for="interviewStatus">
                            Interview Status
                        </label>

                        <select id="interviewStatus">
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="formField fullWidthField">

                        <label for="interviewNotes">
                            Notes
                        </label>

                        <textarea id="interviewNotes"
                                  maxlength="2000"
                                  placeholder="Enter preparation notes or interview details..."></textarea>

                    </div>

                </div>

                <p id="pageMessage"></p>

                <div class="formActions">

                    <a class="secondaryButton backToRemindersButton"
                       href="reminder-interviews.html">
                        Back to Reminders
                    </a>

                    <div class="rightFormActions">

                        <button type="button"
                                id="clearInterviewForm"
                                class="secondaryButton">
                            Clear
                        </button>

                        <button type="submit"
                                id="saveInterviewButton"
                                class="primaryButton">
                            Save Interview
                        </button>

                    </div>

                </div>

            </form>

        </main>

    </div>

</body>
</html>
