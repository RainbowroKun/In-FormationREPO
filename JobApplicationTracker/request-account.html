<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Request an Account - In Formation Jobs</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="site.js"></script>
    <link rel="stylesheet" href="site.css">

    <script type="text/javascript">

        $(document).ready(function () {

            $("#accountRequestForm").submit(
                function (event) {

                    event.preventDefault();
                    SubmitAccountRequest();
                }
            );
        });

        $("#accountRequestForm").submit(
            function (event) {
                event.preventDefault();
                SubmitAccountRequest();
            }
        });

        function CheckPasswordLength() {

            var password = $("#password").val();

            if (password.length > 0 && password.length < 8) {
                ShowPageMessage("Password must be between 8 and 50 characters.", "error")
            }
            else {
                return false);
            }

            ClearPageMessage();
            return true
        }

        function CheckPasswordsMatch() {

            var password = $("#password").val();
            var confirmPassword = $("#confirmPassword").val();

            if (confirmPassword.length > 0 &&
                password != confirmPassword) {

                ShowPageMessage(
                    "Passwords do not match.", "error"
                );

                return false;

                }

            ClearPageMessage();
            return true;
        }

        function SubmitAccountRequest() {

            var firstName = $("#firstName").val().trim();
            var lastName = $("#lastName").val().trim();
            var email = $("#email").val().trim();
            var username = $("#username").val().trim();
            var password = $("#password").val();

            var webMethod = "ProjectServices.asmx/SubmitAccountRequest";

            var parameters = JSON.stringify({
                firstName: firstName,
                lastName: lastName,
                email: email,
                username: username,
                password: password
            });

            $.ajax({
                type: "POST",
                url: webMethod,
                data: parameters,
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {

                    if (msg.d == "Success") {
                        ShowPageMessage(
                            "Thank you for submitting your account request", "success""
                        );

                        form.reset();
                    }
                    else {
                        ShowPageMessage(
                            msg.d, "error"
                        );
                    }
                },

                error: function (xhr) {

                    console.log(xhr.responseText);

                    ShowPageMessage(
                        "Unable to connect to the server.", "error");
                }
            });
        }
    </script>

</head>
<body>
    <main class="centeredPage">
        
        <section class="centeredFormCard">
            <h2>Request an Account</h2>

            <p class="formDescription">
                Complete the form below to request access to In Formation Jobs.
            </p>

            <!-- Form for Requesting an Account -->
            <form id="accountRequestForm">

                <div class="formField">
                    <label>First Name</label>
                    <input type="text"
                           id="firstName"
                           name="firstName"
                           maxlength="25"
                           required />
                </div>

                <div class="formField">
                    <label>Last Name</label>
                    <input type="text"
                           id="lastName"
                           name="lastName"
                           maxlength="25"
                           required />
                </div>

                <div class="formField">
                    <label>Email</label>
                    <input type="email"
                           id="email"
                           name="email"
                           maxlength="50"
                           required />
                </div>

                <div class="formField">
                    <label>Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           maxlength="25"
                           required />
                </div>

                <div class="formField">
                    <label>Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           minlength="8"
                           maxlength="50"
                           onblur="CheckPasswordLength();"
                           required />
                </div>

                <!-- Confirming Password to ensure users typed password correctly -->

                <div class="formField">
                    <label>Confirm Password</label>
                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           minlength="8"
                           maxlength="50"
                           onblur="CheckPasswordsMatch();"
                           required />
                </div>


                    <button type="submit" id="submitRequestButton", class="primaryButton">Submit Request</button>

                    <p id="pageMessage"></p>

                    <p class="formFooter">
                        Already have an account?
                        <a href="login.html">Log In</a>
                    </p>
            </form>
        </section>
    </main>
</body>
</html>
